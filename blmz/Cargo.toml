[package]
name = "blmz"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Production compressor built from the LBLM bit-native context-mixing engine (blmrs strong.rs, adopted defaults)."
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "blmz"
path = "src/lib.rs"

[[bin]]
name = "blmz"
path = "src/bin/blmz.rs"

# Parity builds against the research engine use the platform libm via a compiler cfg (not a
# feature, so no dependent crate can enable it): RUSTFLAGS="--cfg blmz_std_math". Such builds
# write model id 0x81, which normal builds refuse. See tools/parity.sh.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(blmz_std_math)"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false

[profile.test]
opt-level = 3
